<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Daggerheart Play</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b0e10;
        color: #edf2ef;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #0b0e10;
      }

      .app-loading {
        min-height: 100dvh;
        width: 100vw;
        display: grid;
        place-items: center;
        color: rgba(243, 234, 216, 0.78);
        font-size: 0.86rem;
        font-weight: 850;
        letter-spacing: 0;
      }

      .app-loading__content {
        display: inline-grid;
        justify-items: center;
        gap: 12px;
      }

      .app-loading__mark {
        width: 34px;
        height: 34px;
        border: 2px solid rgba(243, 234, 216, 0.2);
        border-top-color: #61d394;
        border-radius: 50%;
        animation: app-loading-spin 0.9s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading__mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading__content">
          <div class="app-loading__mark" aria-hidden="true"></div>
          <span>Загрузка...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
