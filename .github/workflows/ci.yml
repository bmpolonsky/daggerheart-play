name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  typecheck-and-unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: E2E tests
    # Keep broad browser journeys visible, but a browser-engine flake must not
    # hold back a verified build from reaching the table.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore reviewed Daggerheart content cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data
            public/font
            public/image
          key: daggerheart-content-${{ runner.os }}-${{ hashFiles('scripts/cache-daggerheart-data.mjs') }}-${{ github.run_id }}
          restore-keys: |
            daggerheart-content-${{ runner.os }}-${{ hashFiles('scripts/cache-daggerheart-data.mjs') }}-
            daggerheart-content-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e
        env:
          CONTENT_SOURCE: https://daggerheart.su
          CONTENT_LANG: ru
          CONTENT_CACHE_TTL_HOURS: "0"
          CONTENT_REFRESH: "0"
          CONTENT_REFRESH_ASSETS: "0"
          RUN_P2P_E2E: "0"

      - name: Live P2P relay smoke
        if: github.event_name == 'schedule'
        run: npx playwright test tests/e2e/p2p-session.spec.ts --project=chromium --grep "@live-p2p"
        env:
          RUN_P2P_E2E: "1"

  deploy-pages:
    name: Deploy verified build to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # E2E is deliberately advisory: it exercises valuable long journeys, but
    # the deployed artifact is gated by deterministic static and unit checks.
    needs: [typecheck-and-unit]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ci-verified: true
    secrets: inherit
