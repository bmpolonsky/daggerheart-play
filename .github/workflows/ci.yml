name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  typecheck-and-unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e
        env:
          CONTENT_SOURCE: https://daggerheart.su
          CONTENT_LANG: ru
          CONTENT_CACHE_TTL_HOURS: "0"
          RUN_P2P_E2E: ${{ github.event_name == 'schedule' && '1' || '0' }}
