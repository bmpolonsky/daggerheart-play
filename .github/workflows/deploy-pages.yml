name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      ci-verified:
        description: "The caller already completed deterministic CI for this SHA"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      refresh-assets:
        description: "Refresh cached image and font assets"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify manual or scheduled deployment
    if: inputs.ci-verified != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  build:
    name: Build Pages artifact
    needs: verify
    if: always() && (inputs.ci-verified == true || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Daggerheart content cache
        id: daggerheart-content-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data
            public/font
            public/image
          key: daggerheart-content-${{ runner.os }}-${{ hashFiles('scripts/cache-daggerheart-data.mjs') }}-${{ github.run_id }}
          restore-keys: |
            daggerheart-content-${{ runner.os }}-${{ hashFiles('scripts/cache-daggerheart-data.mjs') }}-
            daggerheart-content-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with cached Daggerheart content
        run: npm run build
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_TRYSTERO_SUPABASE_URL: ${{ vars.VITE_TRYSTERO_SUPABASE_URL }}
          VITE_TRYSTERO_SUPABASE_ANON_KEY: ${{ vars.VITE_TRYSTERO_SUPABASE_ANON_KEY }}
          CONTENT_SOURCE: https://daggerheart.su
          CONTENT_LANG: ru
          CONTENT_CACHE_TTL_HOURS: "0"
          CONTENT_REFRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}
          CONTENT_REFRESH_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs['refresh-assets'] && '1' || '0' }}
          CONTENT_ASSET_CONCURRENCY: "8"

      - name: Save Daggerheart content cache
        if: github.event_name == 'schedule' || steps.daggerheart-content-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            public/data
            public/font
            public/image
          key: daggerheart-content-${{ runner.os }}-${{ hashFiles('scripts/cache-daggerheart-data.mjs') }}-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # `verify` is intentionally skipped when this workflow is called from CI.
    # Without an explicit condition GitHub's implicit `success()` also sees
    # that skipped ancestor and silently skips the actual Pages deployment.
    if: always() && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
